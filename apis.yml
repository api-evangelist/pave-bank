name: Pave Bank
description: 'Pave Bank is a licensed, regulated digital bank (National Bank of Georgia,
  License 305) delivering multi-asset, programmable banking. Its Partner API lets developers
  open and manage accounts, initiate domestic and cross-border transfers, execute FX,
  hold and move 29 fiat currencies plus digital assets (USDT, USDC, BTC, ETH), read
  real-time balances and transaction history, generate bank statements, and receive
  signed real-time webhooks. Pave positions itself as an "operating system for money"
  with an app-and-API programmability model built on a first-party Go Application Development
  Kit (PDK). Authentication is OAuth 2.0 client credentials with role-based access;
  requests support idempotency keys and optional JWT payload signing.'
